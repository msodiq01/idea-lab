<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="IDEA LAB platforma ish maydoni"><title>IDEA LAB | Tadbirlar kalendari</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/idea-shell.css"><style>
body{background:#f4f7fc;color:#17243a;font-family:Inter,Arial,sans-serif}.op-wrap{width:min(1120px,calc(100% - 32px));margin:30px auto 70px}.op-head{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;margin-bottom:20px}.op-kicker{font-size:10px;letter-spacing:1.6px;color:#5146e5;font-weight:800}.op-head h1{font-size:clamp(27px,4vw,38px);letter-spacing:-1px;margin:8px 0}.op-head p{font-size:12px;color:#6d7b91;line-height:1.6;margin:0;max-width:700px}.op-demo{font-size:10px;font-weight:700;color:#946200;background:#fff7e6;border:1px solid #f3dfb4;padding:8px 10px;border-radius:30px;white-space:nowrap}.op-panel{background:#fff;border:1px solid #e3eaf3;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 7px 22px rgba(24,42,76,.035)}.op-panel h2{font-size:15px;margin:0 0 12px}.op-muted{font-size:11px;color:#6d7b91;line-height:1.6}.op-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.op-field{display:flex;flex-direction:column;gap:5px}.op-field.full{grid-column:1/-1}.op-field label{font-size:10px;font-weight:700;color:#53627a}.op-field input,.op-field select,.op-field textarea{width:100%;box-sizing:border-box;border:1px solid #dce4ef;border-radius:9px;padding:10px;font:inherit;font-size:11px;background:#fff;color:#17243a}.op-btn{border:0;border-radius:9px;background:#5146e5;color:#fff;font:inherit;font-size:11px;font-weight:700;padding:10px 13px;cursor:pointer}.op-btn.alt{background:#eef0ff;color:#4036c7}.op-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.op-item{border:1px solid #e3eaf3;border-radius:12px;padding:13px;min-width:0}.op-item b{font-size:12px}.op-item p{font-size:10px;color:#6d7b91;line-height:1.5;margin:6px 0}.op-empty{padding:22px;text-align:center;border:1px dashed #d7e0ed;border-radius:12px;color:#6d7b91;font-size:11px;grid-column:1/-1}.op-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.op-pill{font-size:9px;border-radius:30px;padding:5px 8px;background:#eef0ff;color:#4338ca;font-weight:700}.op-table{width:100%;border-collapse:collapse}.op-table td,.op-table th{font-size:10px;text-align:left;padding:9px;border-bottom:1px solid #e3eaf3}.op-table th{color:#6d7b91}.op-note{background:#f7f9fd;padding:11px;border-radius:10px;font-size:10px;line-height:1.6;color:#6d7b91;margin-top:12px}
@media(max-width:650px){.op-wrap{width:calc(100% - 22px);margin-top:20px}.op-head{display:block}.op-demo{display:inline-block;margin-top:10px}.op-form,.op-list{grid-template-columns:1fr}.op-field.full{grid-column:auto}.op-panel{padding:13px}}
</style><link rel="stylesheet" href="assets/idea-nextgen.css">
</head><body><main class="op-wrap"><header class="op-head"><div><div class="op-kicker">IDEA LAB / PLATFORM OPERATIONS</div><h1>Tadbirlar kalendari</h1><p>Uchrashuvlar, taqdimotlar, musobaqalar va loyihalar muddatlarini rejalashtiring.</p></div><span class="op-demo">Mahalliy demo — serverga ulanmagan</span></header>
<section class="op-panel"><h2>Tadbir yaratish</h2><form id="form" class="op-form"><div class="op-field"><label for="title">Tadbir nomi *</label><input id="title" maxlength="120" required></div><div class="op-field"><label for="date">Sana va vaqt *</label><input id="date" type="datetime-local" required></div><div class="op-field"><label for="place">Manzil / onlayn havola</label><input id="place" maxlength="160"></div><div class="op-field"><label for="owner">Tashkilotchi</label><input id="owner" maxlength="80"></div><div class="op-field full"><label for="description">Tavsif</label><input id="description" maxlength="250"></div><div class="op-field full"><button class="op-btn">Tadbirni saqlash</button></div></form></section><section class="op-panel"><h2>Rejalashtirilgan tadbirlar</h2><div id="list" class="op-list"></div></section></main><script>
(()=>{"use strict";const key="ideaLabEvents",$=id=>document.getElementById(id);const read=()=>{try{const x=JSON.parse(localStorage.getItem(key)||"[]");return Array.isArray(x)?x:[]}catch(_){return[]}};function render(){const rows=read().sort((a,b)=>a.date.localeCompare(b.date));$("list").replaceChildren();if(!rows.length){const e=document.createElement("div");e.className="op-empty";e.textContent="Tadbirlar hali kiritilmagan."; $("list").append(e);return}rows.forEach(x=>{const c=document.createElement("article");c.className="op-item";const b=document.createElement("b");b.textContent=x.title;const p=document.createElement("p");p.textContent=new Date(x.date).toLocaleString("uz-UZ")+" · "+(x.place||"Manzil ko‘rsatilmagan");const s=document.createElement("small");s.className="op-muted";s.textContent=(x.owner||"Tashkilotchi ko‘rsatilmagan")+" — "+(x.description||"");c.append(b,p,s);$("list").append(c)})}$("form").addEventListener("submit",e=>{e.preventDefault();const title=$("title").value.trim(),date=$("date").value;if(!title||!date||Number.isNaN(Date.parse(date))){alert("Tadbir nomi va sanasini tekshiring.");return}const rows=read();rows.push({id:Date.now()+"-"+Math.random().toString(36).slice(2,7),title,date,place:$("place").value.trim(),owner:$("owner").value.trim(),description:$("description").value.trim()});try{localStorage.setItem(key,JSON.stringify(rows));e.target.reset();render()}catch(_){alert("Saqlash amalga oshmadi.")}});render()})();</script><script src="assets/idea-shell.js" defer></script></body></html>
