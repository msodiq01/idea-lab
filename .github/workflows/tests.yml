name: IDEA LAB automated tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: idea-lab-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check career and shared data adapter JavaScript syntax
        run: node --check assets/idea-careers-server.js && node --check assets/idea-data.js
      - name: Run regression tests
        run: node --test tests/*.test.cjs

  edge-function-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check IDEA LAB AI Edge Function
        run: deno check supabase/functions/idea-ai/index.ts
