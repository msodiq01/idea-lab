name: IDEA LAB automated tests

on:
  push:
    branches:
      - main
      - feature/unified-applications-stage-2
  pull_request:
    branches:
      - main

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run regression tests
        run: node --test tests/*.test.cjs
